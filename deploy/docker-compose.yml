name: orchestrator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot build of the sandbox image the SandboxedProcessRunner launches per agent run
  # (`docker compose build worker-image-builder`, or just `docker compose build`). It is not
  # meant to stay running - `docker compose up` starts it, it immediately exits, and that is
  # expected.
  worker-image-builder:
    build:
      context: .
      dockerfile: worker.Dockerfile
    image: orchestrator/worker:latest
    command: ["true"]
    restart: "no"

  # The only route out of the `orchestrator-agent` network: sandboxed containers get HTTP_PROXY /
  # HTTPS_PROXY pointed at this host and can reach only the hosts in egress-hosts.list. It also
  # joins the default network, which is where its own route to the internet comes from.
  egress-proxy:
    image: alpine:3.20
    container_name: egress-proxy
    command:
      - sh
      - -c
      - "apk add --no-cache tinyproxy && exec tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf"
    volumes:
      - ./egress-allowlist.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./egress-hosts.list:/etc/tinyproxy/egress-hosts.list:ro
    networks:
      default: {}
      orchestrator-agent:
        # SandboxedProcessRunner points sandboxed containers at HTTP_PROXY=http://egress-proxy:3128;
        # the alias below is what makes that hostname resolve on this network.
        aliases:
          - egress-proxy

  # The orchestrator API host: the ASP.NET application plus its in-process Hangfire server
  # (Program.cs's AddHangfireServer - there is no separate worker process). It runs
  # `docker run` itself (SandboxedProcessRunner) against the *host's* Docker daemon to launch
  # one throwaway container per agent invocation on the orchestrator-agent network below, which
  # is why it needs the host's docker.sock, not its own nested daemon.
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      worker-image-builder:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      # NOTE: ORCHESTRATOR_CONNECTION_STRING is Program.cs's own fallback (read directly, not
      # through ISecretStore/SecretRef like every other secret here) - it is exported by the
      # entrypoint below from the orchestrator.database-connection secret file, not set here.
      # SandboxedProcessRunner shells out to `docker run` for every agent invocation, against
      # the daemon reachable through the socket mounted below - not a nested daemon in this
      # container.
      DOCKER_HOST: "unix:///var/run/docker.sock"
      # Bind-mounted at the identical path on both sides on purpose (see the volumes list): the
      # docker.sock below points at the *host's* dockerd, so any `-v <path>:...` this container's
      # `docker run` calls pass must resolve on the host, not inside this container. Making the
      # two paths identical is what lets the same GIT_ROOT/VAULT_ROOT value work for this
      # container's own file access (LibGit2Workspace, FileSystemVaultStore) and for the paths
      # it hands to a spawned sandbox container.
      # Defaulted (not required) so bringing up an unrelated service - e.g. this repository's own
      # SandboxedProcessRunnerTests, which only ever start egress-proxy - does not force every
      # environment variable this file mentions anywhere to be set. A real `api` deployment must
      # still override both via a .env file next to this one - see deploy/README.md.
      ORCHESTRATOR__GIT__ROOT: "${GIT_ROOT:-/srv/orchestrator/git}"
      ORCHESTRATOR__VAULT__ROOT: "${VAULT_ROOT:-/srv/orchestrator/vault}"
      ORCHESTRATOR__ARTIFACTS__ROOT: /data/artifacts
      # See deploy/README.md for the full secret list and how each SecretRef below maps to one
      # of these variables (EnvironmentSecretStore uppercases the key and joins its dots with
      # underscores). /run/secrets/<name> is the Docker secret file; each is read into the
      # matching variable by docker-entrypoint.sh at container start rather than passed as
      # plaintext compose environment values.
      ORCHESTRATOR_SECRETS_DIR: /run/secrets
    # git.<repository-name>.credential (used by LibGit2Workspace/PullRequestCreationStepHandler
    # per repository - see RepositoryProfile) is not a fixed key, so it is provisioned per
    # repository through the admin /api/admin/integrations endpoint rather than as a docker
    # compose secret here - see deploy/README.md.
    entrypoint: ["/bin/sh", "-c", "\
      export ORCHESTRATOR_CONNECTION_STRING=$$(cat /run/secrets/orchestrator.database-connection); \
      export ORCHESTRATOR_SECRET_SLACK_SIGNING_SECRET=$$(cat /run/secrets/slack.signing-secret); \
      export ORCHESTRATOR_SECRET_SLACK_BOT_TOKEN=$$(cat /run/secrets/slack.bot-token); \
      export ORCHESTRATOR_SECRET_AZUREDEVOPS_PAT=$$(cat /run/secrets/azuredevops.pat); \
      export ORCHESTRATOR_SECRET_AZUREDEVOPS_WEBHOOK_PASSWORD=$$(cat /run/secrets/azuredevops.webhook-password); \
      export ORCHESTRATOR_SECRET_ANTHROPIC_API_KEY=$$(cat /run/secrets/anthropic.api-key); \
      export ORCHESTRATOR_SECRET_OPENAI_API_KEY=$$(cat /run/secrets/openai.api-key); \
      export ORCHESTRATOR_SECRET_P1_STAGING_CONNECTION=$$(cat /run/secrets/p1.staging.connection); \
      exec dotnet Orchestrator.Api.dll"]
    secrets:
      - orchestrator.database-connection
      - slack.signing-secret
      - slack.bot-token
      - azuredevops.pat
      - azuredevops.webhook-password
      - anthropic.api-key
      - openai.api-key
      - p1.staging.connection
    volumes:
      - "${GIT_ROOT:-/srv/orchestrator/git}:${GIT_ROOT:-/srv/orchestrator/git}"
      - "${VAULT_ROOT:-/srv/orchestrator/vault}:${VAULT_ROOT:-/srv/orchestrator/vault}"
      - artifacts-data:/data/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    # Deliberately NOT attached to the orchestrator-agent network: SandboxedProcessRunner talks
    # to sandbox containers through the docker.sock mount above (docker run/logs), not over that
    # network - only the sandbox containers themselves and egress-proxy need to be on it.
    networks:
      default: {}
    healthcheck:
      # No dedicated /health route exists yet; "/" (Program.cs's MapGet("/", ...)) at least
      # proves the host came up and its DI graph resolved.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  orchestrator.database-connection:
    file: ./secrets/orchestrator.database-connection
  slack.signing-secret:
    file: ./secrets/slack.signing-secret
  slack.bot-token:
    file: ./secrets/slack.bot-token
  azuredevops.pat:
    file: ./secrets/azuredevops.pat
  azuredevops.webhook-password:
    file: ./secrets/azuredevops.webhook-password
  anthropic.api-key:
    file: ./secrets/anthropic.api-key
  openai.api-key:
    file: ./secrets/openai.api-key
  p1.staging.connection:
    file: ./secrets/p1.staging.connection

networks:
  default: {}
  # No route out except through egress-proxy above. SandboxedProcessRunner attaches every
  # sandboxed agent container to this network and nothing else. Named explicitly (rather than
  # left to the compose project prefix) because SandboxedProcessRunner passes this exact name to
  # `docker run --network`.
  orchestrator-agent:
    name: orchestrator-agent
    internal: true

volumes:
  postgres-data: {}
  artifacts-data: {}
