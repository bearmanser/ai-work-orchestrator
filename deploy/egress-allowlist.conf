# tinyproxy config for the `egress-proxy` service (deploy/docker-compose.yml).
#
# This is the ONLY route out of the `orchestrator-agent` network (which is `internal: true`), so
# a sandboxed agent process can reach exactly the hosts below and nothing else - not an arbitrary
# host on the internet, not another host on this machine's LAN.
#
# The actual allowlist is a companion file, deploy/egress-hosts.list, referenced below via
# `Filter`; keep the two in sync.

User tinyproxy
Group tinyproxy
Port 3128
Listen 0.0.0.0
Timeout 600

# Any client on the internal network may talk to this proxy; what they may reach through it is
# constrained entirely by the Filter list below.
Allow 0.0.0.0/0

Filter "/etc/tinyproxy/egress-hosts.list"
FilterURLs On
# Extended POSIX regex: each pattern in egress-hosts.list is matched against "host[:port]" for
# both plain HTTP requests and HTTPS CONNECT tunnels.
FilterType ere
FilterDefaultDeny Yes

LogLevel Info
